<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#02030a">
<title>Моя рутина</title>
<meta name="theme-color" content="#02030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рутина">
<style>
/* «Полёт сквозь космос»: одна страница, четыре сцены одной WebGL-картины.
   Галактика = обзор дня, туманность = ритм и тело, чёрное кольцо = учёба, планета = деньги. */
:root{--ink:#eef1ff;--mute:rgba(238,241,255,.6);--dim:rgba(238,241,255,.38);--line:rgba(255,255,255,.08);
--ice:#cfe3ff;--vio:#b9a2ff;--pink:#ff9cc6;--teal:#7fe0e6;--bad:#ff8fa3;
--glass:rgba(9,11,34,.52);--glass-r:rgba(6,8,20,.62);--glass-p:rgba(2,16,22,.6);
--out:cubic-bezier(.16,1,.3,1);--in:cubic-bezier(.55,0,.75,.2);
--f:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#02030a}
body{margin:0;background:#02030a;color:var(--ink);font:400 16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.fallback{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 30% at 50% 22%,rgba(140,150,255,.28),transparent 70%),radial-gradient(50% 30% at 40% 60%,rgba(185,100,220,.18),transparent 70%),radial-gradient(70% 30% at 50% 110%,rgba(80,200,210,.3),transparent 70%),#02030a}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 13px;width:100%;min-width:0;transition:border-color .2s var(--out),background-color .2s}
input:focus,select:focus{border-color:rgba(207,227,255,.6);background:rgba(255,255,255,.08);outline:none}
input::placeholder{color:var(--dim)}
select option{background:#0b0d22;color:var(--ink)}
:focus-visible{outline:1.5px solid var(--ice);outline-offset:3px}
label{display:block;font-size:12px;color:var(--mute);margin:0 0 6px}
h1,h2,h3,p{margin:0;font-weight:400}
.mu{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .15s var(--out),opacity .15s}
.press:active{transform:scale(.95)}
/* ---------- секции ---------- */
.sec{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(16px + env(safe-area-inset-top,0px));font-size:13px;color:var(--mute)}
.top b{font-weight:500;color:var(--ink);letter-spacing:.02em}
.sy{font-size:12px;color:var(--dim)}
.date{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.date .d{font-size:14px;color:var(--mute)}
.dnav{display:flex;gap:8px}
.dnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(2,3,10,.35);font-size:18px;color:var(--ink);transition:transform .15s var(--out),opacity .2s}
.dnav button:active{transform:scale(.88)}
.dnav button:disabled{opacity:.25}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:4px}
.score b{font-weight:200;font-size:clamp(76px,24vw,104px);line-height:.95;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.score b i{font-style:normal;font-size:.3em;color:var(--ice);letter-spacing:0;margin-left:4px;font-weight:300}
.score>span{font-size:13px;color:var(--mute);text-align:right;max-width:140px;padding-bottom:12px}
/* галактика и подписи на рукавах */
.stage{position:relative;height:340px;margin:0 -18px}
.lab{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 0}
.lab .t{display:flex;flex-direction:column}
.lab .t small{font-size:12px;color:var(--mute)}
.lab .t b{font-size:21px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.lab .ln{width:44px;height:1px;background:var(--c);opacity:.8;transform-origin:var(--o) center}
.lab .dt{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.lab.r .t{text-align:right}
.lab.attn .t b{color:var(--pink)}
.l1{left:24px;top:22px;--c:var(--vio);--o:left}
.l2{right:24px;top:56px;--c:var(--ice);--o:right}
.l3{left:24px;top:232px;--c:var(--pink);--o:left}
.l4{right:24px;top:262px;--c:var(--teal);--o:right}
/* что важно */
.focus{margin-top:6px;display:grid;gap:10px}
.focus h3{font-size:13px;color:var(--mute)}
.pill{display:block;width:100%;text-align:center;padding:15px;border-radius:999px;background:var(--ink);color:#060920;font-weight:500;font-size:15px;box-shadow:0 0 30px rgba(207,227,255,.18)}
.fi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line);font-size:14px}
.fi:first-of-type{border-top:0}
.fi i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.fi span{flex:1;min-width:0}.fi em{font-style:normal;color:var(--dim)}
.calm{padding:14px 0;color:var(--mute);font-size:14px}
/* заголовки сцен */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:120px}
.tt{font-size:32px;font-weight:300;line-height:1.1;overflow:hidden;padding-bottom:2px}
.tt>span{display:inline-block}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.lnk{font-size:13px;color:var(--mute);padding:6px 2px}
.gap-neb{height:230px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(130%);backdrop-filter:blur(20px) saturate(130%);border:1px solid rgba(180,190,255,.16);border-radius:28px;padding:6px 18px;margin-bottom:10px}
.card.pad{padding:18px}
.card h3{font-size:13px;color:var(--mute);margin-bottom:10px}
#s-ring .card{background:var(--glass-r);border-color:rgba(200,215,255,.14)}
.under .card{background:var(--glass-p);border-color:rgba(127,224,230,.2)}
/* привычки */
.hb{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.hb:first-child{border-top:0}
.ck{position:relative;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(238,241,255,.55);display:grid;place-items:center;transition:background-color .2s var(--out),border-color .2s var(--out),transform .15s var(--out),box-shadow .3s}
.ck:active{transform:scale(.82)}
.ck svg{width:15px;height:15px;fill:none;stroke:#060920;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;opacity:0}
.ck.on{background:var(--ink);border-color:var(--ink);box-shadow:0 0 16px rgba(207,227,255,.35)}
.ck.on svg{stroke-dashoffset:0;opacity:1}
.ck.pop svg{animation:draw .3s var(--out) both}
.ck.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--ice);animation:burst .5s var(--out) forwards;pointer-events:none}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes burst{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
.spark{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c,#cfe3ff);pointer-events:none;animation:fly .6s var(--out) forwards}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.hb .n{flex:1;min-width:0;transition:color .3s}
.hb.done .n{color:var(--dim)}
.hb .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.hb .meta small{font-size:11px;color:var(--vio)}
.wk{display:flex;gap:3px}
.wk i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.14)}
.wk i.on{background:var(--vio);box-shadow:0 0 6px var(--vio)}
.x{flex:none;width:34px;height:34px;border-radius:50%;color:var(--dim);font-size:20px}
.addrow{display:flex;gap:8px;padding:12px 0 14px}
/* плитки */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(180,190,255,.14);border-radius:24px;padding:14px}
.tile.wide{grid-column:1/-1}
.tile .k{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.tile .v{font-size:34px;font-weight:200;line-height:1;margin:10px 0 8px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-height:34px}
.tile .v small{font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-left:4px}
.spk{display:flex;align-items:flex-end;gap:4px;height:24px;margin-bottom:12px}
.spk i{flex:1;border-radius:2px;background:rgba(255,255,255,.2);transform-origin:50% 100%;height:100%;transform:scaleY(var(--h))}
.spk i.t{background:var(--c,var(--ice));box-shadow:0 0 8px var(--c,var(--ice))}
.spk i.t.grow{animation:sy .4s var(--out) both}
@keyframes sy{from{transform:scaleY(var(--h0,0))}to{transform:scaleY(var(--h))}}
.stp{display:flex;gap:6px}
.stp button{flex:1;height:40px;border-radius:13px;border:1px solid var(--line);font-size:20px;font-weight:300;transition:transform .12s var(--out),background-color .2s,color .2s}
.stp button:active{transform:scale(.9);background:var(--ink);color:#060920}
/* кольцо */
.ringbox{position:relative;width:210px;height:210px;margin:56px auto 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringbox b{font-size:86px;font-weight:200;line-height:.9;font-variant-numeric:tabular-nums}
.ringbox>span{font-size:13px;color:var(--ice);margin-top:6px;max-width:150px}
.dl{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.dl .t{flex:1;min-width:0;display:flex;flex-direction:column}
.dl .t b{font-weight:400;font-size:15px;overflow-wrap:anywhere}
.dl .t span{font-size:12px;color:var(--mute)}
.dl.done .t{opacity:.4}
.chip{font-size:13px;color:var(--mute);white-space:nowrap}
.chip.warn{color:var(--pink)}.chip.bad{color:var(--bad)}
.dl.new{animation:fromring .5s var(--out) both}
@keyframes fromring{from{opacity:0;transform:translateY(-30px) scale(.6)}to{opacity:1;transform:none}}
/* деньги */
.total b{display:block;font-size:clamp(52px,16vw,64px);font-weight:200;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.total>span{font-size:13px;color:var(--mute)}
.bud{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin:20px 0 10px}
.bud i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--teal);box-shadow:0 0 10px var(--teal);transform-origin:left center;transform:scaleX(var(--w));transition:transform .6s var(--out)}
.bud.over i{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.bud em{position:absolute;top:-6px;width:1.5px;height:15px;background:var(--mute);left:calc(var(--p)*100%)}
.cat{padding:9px 0}
.cat .row{font-size:14px;margin-bottom:7px}
.cb{height:2px;border-radius:1px;background:rgba(255,255,255,.08);overflow:hidden}
.cb i{display:block;height:100%;width:100%;background:rgba(238,241,255,.8);transform-origin:left center;transform:scaleX(var(--w))}
.rv.in .cb i,.rv.in .bud i{animation:gx .8s var(--out) both;animation-delay:calc(.15s + var(--i,0)*70ms)}
.rv.in.inst .cb i,.rv.in.inst .bud i{animation:none}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(var(--w))}}
.horizon{height:420px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column}
.li .t b{font-weight:400;font-size:15px}.li .t span{font-size:12px;color:var(--mute)}
.btn{display:block;width:100%;text-align:center;padding:14px 18px;border-radius:999px;background:var(--ink);color:#060920;font-weight:500;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.2)}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:14px}
.gapf{display:grid;gap:12px}
.meteor{position:fixed;z-index:20;left:0;top:0;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px var(--teal),0 0 40px 10px rgba(127,224,230,.35);pointer-events:none}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed rgba(255,255,255,.22);border-radius:20px;padding:11px 14px;margin-top:14px;font-size:13px;color:var(--mute);background:rgba(2,3,10,.4)}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:24px 0 0}
.flash{animation:fl .5s var(--out)}
@keyframes fl{0%{opacity:.35}100%{opacity:1}}
/* режим, помощник, питание, тренировки, вес, бюджет */
.dtype{display:inline-block;font-size:12px;color:var(--ice);border:1px solid rgba(207,227,255,.3);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.tl{display:grid;grid-template-columns:50px 14px 1fr;gap:10px;align-items:start;padding:7px 0;position:relative}
.tl .tm{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:1px}
.tl .dt{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--k,#cfe3ff);box-shadow:0 0 8px var(--k,#cfe3ff)}
.tl .tx{font-size:14px;line-height:1.35}
.tl .tx small{display:block;font-size:12px;color:var(--mute)}
.tl.past{opacity:.38}
.tl.now .tx{font-weight:500}
.tl.now .dt{transform:scale(1.4);animation:pulse 1.8s var(--out) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--k)}50%{box-shadow:0 0 16px 3px var(--k)}}
.nowchip{display:inline-block;font-size:11px;color:#060920;background:var(--ice);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.k-sleep{--k:#9aa8ff}.k-eat{--k:#7fe0e6}.k-study{--k:#cfe3ff}.k-work{--k:#ff9cc6}.k-train{--k:#b9a2ff}.k-move{--k:rgba(238,241,255,.55)}.k-rule{--k:var(--mid)}
.tip{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.tip:first-of-type{border-top:0}
.tip i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--c,#cfe3ff);box-shadow:0 0 8px var(--c,#cfe3ff)}
.tip.day{color:var(--mute);font-size:13px}
.meal{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{flex:1;min-width:0;display:flex;flex-direction:column}.meal .t b{font-weight:400;font-size:14px}.meal .t span{font-size:12px;color:var(--mute)}
.meal.done .t{opacity:.45}
.pbar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 10px}
.pbar i{display:block;height:100%;width:100%;background:var(--teal);box-shadow:0 0 8px var(--teal);transform-origin:left;transform:scaleX(var(--w));transition:transform .5s var(--out)}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .t{flex:1;min-width:0;font-size:14px}.ex .r{font-size:13px;color:var(--mute);white-space:nowrap}
.ex.done .t{opacity:.45}
.wchart{display:block;width:100%;height:auto;margin:6px 0 10px}
.cashbig b{display:block;font-size:44px;font-weight:200;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cashbig>span{font-size:13px;color:var(--mute)}
.inc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.inc:first-child{border-top:0}
.inc .t{flex:1;min-width:0;display:flex;flex-direction:column}.inc .t b{font-weight:400;font-size:14px}.inc .t span{font-size:12px;color:var(--mute)}
.inc.ok .t{opacity:.45}
.inc input{width:110px;text-align:right;padding:8px 10px}
/* работа */
#s-work .card,#s-work .tile{background:rgba(5,9,26,.58);border-color:rgba(160,200,255,.16)}
.starbox{position:relative;height:270px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding-bottom:4px}
.shiftring{position:absolute;left:50%;top:12px;width:170px;height:170px;margin-left:-85px;transform:rotate(-90deg);overflow:visible}
.shiftring circle{fill:none;stroke-width:2}
.shiftring .tr{stroke:rgba(200,220,255,.12)}
.shiftring .fg{stroke:#dbe8ff;stroke-linecap:round;filter:drop-shadow(0 0 6px #9fc4ff);transition:stroke-dashoffset 1.2s var(--out)}
.starbox b{font-size:20px;font-weight:400;max-width:300px}
.starbox>span{font-size:13px;color:var(--mute);margin-top:2px}
.wst{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.wst .tile .v{font-size:32px;margin:8px 0 2px}
.wst .tile .s{font-size:12px;color:var(--mute)}
.bud.ice i{background:var(--ice);box-shadow:0 0 10px var(--ice)}
.calh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px}
.calh button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);font-size:18px;transition:transform .15s var(--out)}
.calh button:active{transform:scale(.88)}
.calh b{font-weight:500;font-size:17px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;text-align:center}
.cgrid.sl-l{animation:slL .45s var(--out)}.cgrid.sl-r{animation:slR .45s var(--out)}
@keyframes slL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.wd{font-size:12px;color:var(--dim);padding:2px 0 4px}
.cd{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.05);color:var(--mute);transition:background-color .35s var(--out),color .35s,box-shadow .5s,transform .15s var(--out)}
.cd:active{transform:scale(.86)}
.cd.on{background:radial-gradient(circle at 38% 32%,#fff 0,#e3edff 50%,#a9c6ff 100%);color:#060920;font-weight:500;box-shadow:0 0 16px rgba(170,200,255,.55)}
.cd.on.fut{background:rgba(207,227,255,.07);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(207,227,255,.85),0 0 14px rgba(170,200,255,.3)}
.cd.tod::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(207,227,255,.75)}
.cd .pd{position:absolute;bottom:13%;width:4px;height:4px;border-radius:50%;background:#060920;opacity:.45}
.cd.ign{animation:ign .55s var(--out)}
@keyframes ign{0%{transform:scale(.55);box-shadow:0 0 0 rgba(170,200,255,0)}55%{transform:scale(1.15);box-shadow:0 0 34px rgba(190,215,255,.9)}100%{transform:scale(1)}}
.cd.fade{animation:fadeo .4s var(--out)}
@keyframes fadeo{0%{transform:scale(1.12);opacity:.5}100%{transform:scale(1);opacity:1}}
.cnote{font-size:12px;color:var(--dim);margin:14px 0 8px}
.pay{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pay .t{flex:1;min-width:0;display:flex;flex-direction:column}.pay .t b{font-weight:400;font-size:15px}.pay .t span{font-size:12px;color:var(--mute)}

<script>
/* ================= данные ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MNN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const DWF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const fmt=(n,d=1)=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:d});
const num=v=>parseFloat(String(v).replace(',','.').replace(/\s/g,''));
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const GOAL={sleep:8,water:2,sport:30,study:2};
const WPRE={'2026-11-01':16600,'2026-11-03':19600,'2026-11-04':17200,'2026-11-07':16000,'2026-11-08':16000,'2026-11-10':14200,'2026-11-11':16000,'2026-11-12':25000,'2026-11-15':17200,'2026-11-16':18100,'2026-11-19':17500,'2026-11-20':19900,'2026-11-21':13900,'2026-11-23':0,'2026-11-24':0,'2026-11-27':0,'2026-11-28':0};
const DEF=()=>({v:3,cur:'₸',budget:150000,work:{start:'20:00',end:'08:00',rate:0,goal:0,shifts:Object.assign({},WPRE)},weights:{'2026-11-23':92},train:{done:{},ex:{}},cash:{start:50000,at:new Date(2026,10,23,0,0).getTime(),reserve:5000,inc:[{id:1,d:'2026-12-06',amt:100000,n:'Поступление 100 000',got:false},{id:2,d:'2026-12-15',amt:0,n:'Зарплата за смены',got:false,salary:1}],fix:[{id:3,n:'Тариф связи',amt:7000,d:'2026-11-30',paid:false},{id:4,n:'Аренда',amt:50000,d:'2026-12-06',paid:false}]},habits:[{id:'h1',name:'Подъём по плану'},{id:'h2',name:'Спорт'},{id:'h3',name:'Чтение'},{id:'h4',name:'План на завтра'}],cats:['Еда','Транспорт','Учёба','Подписки','Другое'],days:{},spend:[],dl:[]});
let st=DEF(),sel=TODAY,edit=false;
let dbDoc=null,dbReady=false,dirty=false,sync='load',wt=null,wbusy=false,wagain=false;
const apply=o=>{const d=DEF();st=Object.assign(d,o||{});delete st.sky;['habits','cats'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=d[k]});if(!st.days||typeof st.days!=='object')st.days={};if(!Array.isArray(st.spend))st.spend=[];if(!Array.isArray(st.dl))st.dl=[];if(!(st.budget>0))st.budget=d.budget;if(!st.work||typeof st.work!=='object')st.work=d.work;if(!st.weights||typeof st.weights!=='object')st.weights=d.weights;if(!st.train||typeof st.train!=='object')st.train=d.train;if(!st.train.done)st.train.done={};if(!st.train.ex)st.train.ex={};if(!st.cash||typeof st.cash!=='object')st.cash=d.cash;if(!Array.isArray(st.cash.inc))st.cash.inc=d.cash.inc;if(!Array.isArray(st.cash.fix))st.cash.fix=d.cash.fix;if(!st.work.shifts||typeof st.work.shifts!=='object')st.work.shifts={};['start','end'].forEach(k=>{if(!/^\d\d:\d\d$/.test(st.work[k]||''))st.work[k]=d.work[k]})};
try{const s=localStorage.getItem('routine1');if(s)apply(JSON.parse(s))}catch(e){}
/* графики смен из рабочего чата (Алинур): в диапазоне ставятся только эти дни; оплаченные смены не трогаются */
const PATCHES=[{id:'alinur-2026-11-21',from:'2026-11-21',to:'2026-11-30',days:['2026-11-23','2026-11-26','2026-11-27','2026-11-30']}];
function applyPatches(){if(!Array.isArray(st.patches))st.patches=[];let ch=false;const S=st.work.shifts;
PATCHES.forEach(P=>{if(st.patches.includes(P.id))return;for(let k=P.from;k<=P.to;k=addD(k,1)){const want=P.days.includes(k);if(want&&S[k]==null)S[k]=st.work.rate||0;else if(!want&&S[k]!=null&&!(S[k]>0))delete S[k]}st.patches.push(P.id);ch=true});
return ch}
const SYT={load:'Загрузка…',ok:'Сохранено',saving:'Сохраняю…',err:'Не сохранилось в облако',local:'Только на этом устройстве'};
function setSync(){document.querySelectorAll('[data-sy]').forEach(e=>e.textContent=SYT[sync]||'')}
async function pushDb(){if(!dbDoc||!dbReady)return;if(wbusy){wagain=true;return}wbusy=true;
try{await dbDoc.set(JSON.parse(JSON.stringify(st)));sync='ok'}catch(e){sync='err'}
wbusy=false;if(wagain){wagain=false;pushDb()}else setSync()}
let trVer=0;const trMemo={};
function save(){trVer++;try{localStorage.setItem('routine1',JSON.stringify(st))}catch(e){}dirty=true;if(dbDoc&&dbReady){sync='saving';setSync();clearTimeout(wt);wt=setTimeout(pushDb,400)}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const day=k=>st.days[k]||{};
function setDay(k,fn){const o=Object.assign({},st.days[k]);delete o.demo;fn(o);st.days[k]=o;save()}
const hasDemo=()=>Object.values(st.days).some(d=>d.demo)||st.spend.some(s=>s.demo)||st.dl.some(s=>s.demo);
function seed(){
const rows=[[7.5,2,3,45,1.5,7],[6,1.5,2.5,0,1,5],[7,3,4,30,2,8],[8,2,3.5,60,1.75,8],[6.5,0,1,0,1,4],[7.5,2.5,4,40,2,7],[7,2,3,30,1.5,6]];
rows.forEach((r,i)=>{const k=addD(TODAY,i-6);if(st.days[k])return;const done={};st.habits.forEach((h,j)=>{if((i+j)%3!==0)done[h.id]=true});
st.days[k]={sleep:r[0],study:r[1],deep:r[2],sport:r[3],water:r[4],mood:r[5],done,demo:1}});
[['Еда',3200],['Транспорт',900],['Еда',2400],['Подписки',1500],['Учёба',4000]].forEach((s,i)=>st.spend.push({id:Date.now()+i,d:addD(TODAY,-i),cat:s[0],amt:s[1],note:'',demo:1}));
[['Физика','Лабораторная',2],['Математика','Контрольная',5],['Английский','Эссе',9]].forEach((s,i)=>st.dl.push({id:Date.now()+10+i,subj:s[0],task:s[1],due:addD(TODAY,s[2]),done:false,demo:1}));
save()}
function unseed(){Object.keys(st.days).forEach(k=>{if(st.days[k].demo)delete st.days[k]});st.spend=st.spend.filter(s=>!s.demo);st.dl=st.dl.filter(s=>!s.demo);save()}
const greet=()=>{const h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'};
const longDate=k=>{const d=parse(k);return DWF[d.getDay()]+', '+d.getDate()+' '+MN[d.getMonth()]};
const shortDate=k=>{const d=parse(k);return d.getDate()+' '+MN[d.getMonth()]};
const dleft=due=>Math.round((parse(due)-parse(TODAY))/864e5);
const week=()=>{const a=[];for(let i=6;i>=0;i--)a.push(addD(sel,-i));return a};
function streak(id){let n=0,k=sel;if(!(day(k).done||{})[id])k=addD(k,-1);while((day(k).done||{})[id]){n++;k=addD(k,-1)}return n}
function model(){
const d=day(sel),dn=d.done||{},nh=st.habits.length,dc=st.habits.filter(h=>dn[h.id]).length,hr=new Date().getHours(),isT=sel===TODAY;
const open=st.dl.filter(x=>!x.done).sort((a,b)=>a.due.localeCompare(b.due)),nx=open[0];
const mk=TODAY.slice(0,7),ms=st.spend.filter(s=>s.d.slice(0,7)===mk),spent=ms.reduce((a,s)=>a+s.amt,0);
const td=new Date(),dim=new Date(td.getFullYear(),td.getMonth()+1,0).getDate(),pace=td.getDate()/dim,over=spent>st.budget*pace;
return {d,dn,nh,dc,hr,isT,open,nx,nd:nx?dleft(nx.due):null,ms,spent,pace,over}}
/* ================= работа ================= */
let wm=TODAY.slice(0,7),wdir='',wset=false,wign=null,wfade=null;
const tmin=t=>{const a=t.split(':');return +a[0]*60+ +a[1]};
const shiftH=()=>{let d=tmin(st.work.end)-tmin(st.work.start);if(d<=0)d+=1440;return d/60};
const startAt=k=>{const d=parse(k),m=tmin(st.work.start);d.setHours(Math.floor(m/60),m%60,0,0);return d};
function wmodel(month){const S=st.work.shifts,H=shiftH(),ks=Object.keys(S).filter(k=>k.slice(0,7)===month).sort();
const fut=ks.filter(k=>k>TODAY),paid=ks.filter(k=>S[k]>0),earned=paid.reduce((a,k)=>a+S[k],0),need=ks.filter(k=>k<TODAY&&!(S[k]>0));
const avg=paid.length?earned/paid.length:0,open=ks.filter(k=>!(S[k]>0)).length,forecast=earned+open*(st.work.rate||avg);
return {ks,fut,paid,earned,need,avg,H,hours:ks.length*H,perH:paid.length?earned/(paid.length*H):0,forecast,best:paid.reduce((a,k)=>S[k]>a?S[k]:a,0)}}
function wstatus(){const S=st.work.shifts,H=shiftH()*3600e3,now=new Date();
for(const k of [addD(TODAY,-1),TODAY]){if(S[k]==null)continue;const a=startAt(k);if(now>=a&&now<a.getTime()+H)return {live:1,fr:(now-a)/H,left:a.getTime()+H-now}}
const nx=Object.keys(S).filter(k=>k>=addD(TODAY,-1)).sort().map(startAt).find(a=>a>now);return {live:0,next:nx?nx-now:null,nextD:nx}}
const dur=ms=>{const m=Math.round(ms/6e4),h=Math.floor(m/60),mm=m%60;return h>=24?Math.floor(h/24)+' '+plural(Math.floor(h/24),'день','дня','дней')+(h%24?' '+h%24+' ч':''):(h?h+' ч ':'')+mm+' мин'};
function wtext(){const w=wstatus();if(w.live)return {b:'Смена идёт',s:'осталось '+dur(w.left),fr:w.fr};
if(w.next==null)return {b:'Смен впереди нет',s:'отметь смены в календаре',fr:0};
const d=w.nextD,dk=iso(d);return {b:'Смена через '+dur(w.next),s:(dk===TODAY?'сегодня':dk===addD(TODAY,1)?'завтра':shortDate(dk))+', '+st.work.start+'–'+st.work.end,fr:0}}
function updStatus(){const t=wtext(),b=document.getElementById('st-b'),sp=document.getElementById('st-s'),c=document.getElementById('st-fg');if(b)b.textContent=t.b;if(sp)sp.textContent=t.s;if(c)c.style.strokeDashoffset=(c.dataset.c*(1-t.fr)).toFixed(1)}
setInterval(updStatus,30000);
/* ================= план дня: пары, тип дня, режим ================= */
const CLS={1:['08:30','15:20'],2:['08:30','13:20'],3:['08:30','14:20'],4:['08:30','12:20'],5:['10:30','12:20']};
const COM=60,GYM='2027-01-18',WSTART='2026-11-23',WEND='2027-06-30',WKG0=92,WKG1=78,PROT=160,KCAL=2400;
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const wdn=k=>{const g=parse(k).getDay();return g===0?7:g};
function clsOf(k){if(!inTerm(k))return null;const c=CLS[wdn(k)];return c?{s:tmin(c[0]),e:tmin(c[1])}:null}
function dayType(k){const S=st.work.shifts,on=S[k]!=null,prev=S[addD(k,-1)]!=null,c=clsOf(k);if(prev&&on)return 'G2';if(prev&&c)return 'V';if(prev)return 'G';if(on)return c?'A':'A0';return c?'D':'E'}
const DTN={A:'Пары, ночью смена',A0:'Ночью смена',V:'После смены, есть пары',G:'После смены, выходной',G2:'Между двумя сменами',D:'Учебный день',E:'Выходной'};
function wakeOf(k){const c=clsOf(k);return c?c.s-COM-60:480}
function bedFor(k){const w=wakeOf(addD(k,1))+1440;return Math.min(1380,Math.max(1350,w-480))}
/* тренировки */
const WO={A:{n:'Дом А',ex:[['Приседания с рюкзаком','4 × 15–20'],['Отжимания','4 × до отказа −2'],['Тяга рюкзака в наклоне','4 × 12–15'],['Болгарские выпады','3 × 10 на ногу'],['Румынская тяга на одной ноге','3 × 12 на ногу'],['Планка','3 × 40–60 с']]},
B:{n:'Дом Б',ex:[['Подтягивания или австралийские','4 × до отказа −1'],['Выпады назад','4 × 12 на ногу'],['Отжимания с поднятым тазом','3 × 8–10'],['Ягодичный мост на одной ноге','3 × 15 на ногу'],['Отжимания от стула на трицепс','3 × 12–15'],['Подъём ног лёжа','3 × 15']]},
U:{n:'Зал: верх',ex:[['Жим штанги лёжа','4 × 6–8'],['Тяга штанги в наклоне','4 × 8'],['Жим гантелей сидя','3 × 10'],['Тяга верхнего блока','3 × 10–12'],['Разведения в стороны','3 × 15'],['Бицепс и трицепс на блоке','по 2 × 12']]},
L:{n:'Зал: низ',ex:[['Приседания со штангой','4 × 6–8'],['Румынская тяга','3 × 8–10'],['Жим ногами','3 × 12'],['Выпады с гантелями','2 × 10 на ногу'],['Подъёмы на носки','3 × 15'],['Скручивания на блоке','3 × 12']]},
F:{n:'Зал: всё тело',ex:[['Становая тяга (техника важнее веса)','3 × 5'],['Жим гантелей на наклонной','3 × 10'],['Подтягивания или гравитрон','3 × 8–10'],['Болгарские выпады','3 × 10 на ногу'],['Тяга каната к лицу','3 × 15'],['Планка','3 × 45 с']]}};
function weekCount(k){const d=parse(k),off=(d.getDay()+6)%7;let n=0;for(let i=0;i<7;i++){const x=addD(k,i-off);if(x!==k&&st.train.done[x])n++}return n}
function trainFor(k){const mk=k+'|'+trVer+'|'+TODAY;if(trMemo[mk])return trMemo[mk];return trMemo[mk]=trainFor0(k)}
function plannedBefore(k){const off=(parse(k).getDay()+6)%7;let n=0;for(let i=0;i<off;i++){const x=addD(k,i-off);if(x>=TODAY&&!st.train.done[x]){const t=trainFor(x);if(t.w)n++}}return n}
function trainFor0(k){const D=st.train.done;if(D[k])return {code:D[k],w:WO[D[k]],done:true};const T=dayType(k);

const u={};['R','T','U','Y','V','L','K','M','A','I','W','G','N','B','Q','S'].forEach(x=>u[x]=gl.getUniformLocation(pr,x));
let k=.5,T=0,raf=0,last=0,t0=performance.now(),Lc=.3,Lt=.3,P={K:0,M:0,A:0,W:0},vel=0,lastY=scrollY,an={};
function size(){const dpr=Math.min(devicePixelRatio||1,2);k=dpr*.45;const px=innerWidth*innerHeight*k*k;if(px>7e5)k*=Math.sqrt(7e5/px);
el.width=Math.max(2,Math.round(innerWidth*k));el.height=Math.max(2,Math.round(innerHeight*k));gl.viewport(0,0,el.width,el.height);gl.uniform2f(u.R,el.width,el.height)}
api.anchors=()=>{an={};const r=SECS[scr];if(r)r.querySelectorAll('[data-sc]').forEach(e=>{an[e.dataset.sc]=e})};
const SW={G:0,N:0,B:0,S:0,Q:0},STG={G:0,N:0,B:0,S:0,Q:0},LY={};
const vis=el2=>{if(!el2)return 0;const r=el2.getBoundingClientRect(),vh=innerHeight;const o=Math.min(r.bottom,vh)-Math.max(r.top,0);return Math.max(0,Math.min(1,o/Math.min(vh,r.height)))};
const sm=x=>x*x*(3-2*x);
function draw(now){if(!an)api.anchors();const H=innerHeight,cw=innerWidth/2,Ucss=2.16*Math.min(innerWidth,520),cy=e=>{const r=e.getBoundingClientRect();return r.top+r.height/2};
const intro=RM.matches?1:Math.min(1,(now-t0)/2200),I=1-Math.pow(1-intro,3);
gl.uniform1f(u.T,T);gl.uniform1f(u.U,Ucss*k);gl.uniform1f(u.Y,scrollY*k);gl.uniform1f(u.V,RM.matches?0:Math.max(Math.min(vel,40),-40)*.08+(1-I)*6);
gl.uniform1f(u.L,Lc);gl.uniform1f(u.K,P.K);gl.uniform1f(u.M,P.M);gl.uniform1f(u.A,P.A);gl.uniform1f(u.W,P.W);gl.uniform1f(u.I,I);
const yOf={G:cy,N:cy,B:cy,S:e=>e.getBoundingClientRect().top+97,Q:e=>e.getBoundingClientRect().top+250+.95*Ucss};
for(const x in SW){const e=an[x];if(e&&e.isConnected&&e.offsetParent)LY[x]=yOf[x](e)}
const s3=(x,xo)=>gl.uniform3f(u[x],(cw+(xo||0))*k,(H-(LY[x]!=null?LY[x]:H*.4))*k,x==='G'?Math.max(SW[x],.0001):SW[x]);
s3('G');s3('N');s3('B');s3('S');s3('Q',-.05*Ucss);
gl.drawArrays(gl.TRIANGLES,0,3)}
function loop(ts){raf=requestAnimationFrame(loop);if(document.hidden)return;if(ts-last<30)return;const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;
T+=dt*(1+P.K*3);const dyS=scrollY-lastY;lastY=scrollY;vel+=(dyS-vel)*.35;
Lc+=(Lt-Lc)*Math.min(1,dt*2.5);for(const x in SW)SW[x]+=(STG[x]-SW[x])*Math.min(1,dt*3.4);for(const x in P)P[x]*=Math.exp(-dt*1.6);draw(ts)}
function start(){cancelAnimationFrame(raf);if(RM.matches){Lc=Lt;draw(performance.now())}else raf=requestAnimationFrame(loop)}
let sq2=0;addEventListener('scroll',()=>{if(RM.matches&&!sq2)sq2=requestAnimationFrame(()=>{sq2=0;draw(performance.now())})},{passive:true});
addEventListener('resize',()=>{size();draw(performance.now())});
el.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf)});
el.addEventListener('webglcontextrestored',()=>location.reload());
if(RM.addEventListener)RM.addEventListener('change',start);
size();
api.set=l=>{Lt=.25+.75*Math.max(0,Math.min(1,l));if(RM.matches){Lc=Lt;draw(performance.now())}};
api.pulse=(x,v)=>{if(!RM.matches)P[x]=Math.max(P[x],v)};api.start=start;
api.scene=(sc,now)=>{for(const x in STG)STG[x]=x===sc?1:0;if(now||RM.matches){for(const x in SW)SW[x]=STG[x];draw(performance.now())}};
api.warp=v=>{if(!RM.matches)vel=v};
return api})();
let booted=false;
if(applyPatches()|migrate())save();
SECS[scr].classList.add('on');FX.scene(SCR[scr].sc,true);render(scr==='today'?'':'enter');booted=true;checkAch();FX.start();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('go')));
(async()=>{try{
if(!window.claude){sync='local';setSync();return}
const db=await claude.use('db'),user=await claude.use('user');
if(!db||!user){sync='local';setSync();return}
const id=await user.id();if(!id){sync='local';setSync();return}
dbDoc=db.doc('data/users/'+id+'/routine');
const snap=await dbDoc.get();
if(snap.exists){const o=snap.data()||{};
if(dirty){const loc=st;apply(o);Object.assign(st.days,loc.days);st.budget=loc.budget;const ids=new Set(st.spend.map(s=>s.id));loc.spend.forEach(s=>{if(!ids.has(s.id))st.spend.push(s)});const di=new Set(st.dl.map(s=>s.id));loc.dl.forEach(s=>{if(!di.has(s.id))st.dl.push(s)})}else apply(o);
if(applyPatches()|migrate())dirty=true;
try{localStorage.setItem('routine1',JSON.stringify(st))}catch(e){}
dbReady=true;sync='ok';if(dirty)await pushDb();render()}
else{dbReady=true;sync='ok';if(dirty||Object.keys(st.days).length||st.spend.length||st.dl.length)await pushDb();render()}
}catch(e){sync=dbDoc?'err':'local';setSync()}})();
</script>
